# Supabase CLI configuration
# https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20

[realtime]
enabled = true
ip_version = "IPv4"

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "1GiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://hire.cmbpo.com", "https://hire.cmbpo.com/*", "https://*.vercel.app", "http://localhost:3000", "http://localhost:3000/**", "https://hire.cmbpo.com/auth/callback", "http://localhost:5175", "hiring.cmbpo.com", "https://hiring.cmbpo.com/*"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

# Edge Functions configuration
[edge_runtime]
enabled = true

[functions.training-public]
verify_jwt = false
