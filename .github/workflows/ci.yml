name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # ── Frontend ──────────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check (frontend)
        run: npx tsc --noEmit

      - name: Vitest (frontend)
        run: npx vitest run

      # ── Backend (Express dev server) ──────────────────────────
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: TypeScript check (server)
        working-directory: server
        run: npx tsc --noEmit

      - name: Vitest (server)
        working-directory: server
        run: npx vitest run
