name: Training video compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: training-video-compatibility-production
  cancel-in-progress: false

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ylif4-fix
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: compatibility-report.json
          key: training-video-verification-${{ github.run_id }}
          restore-keys: training-video-verification-
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Create missing compatible variants
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/training-video-compatibility.mjs --report compatibility-report.json
      - name: Save verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-video-compatibility-${{ github.run_id }}
          path: compatibility-report.json
          retention-days: 14
          if-no-files-found: ignore
