<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>视频分享</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f8fafc;
        color: #111827;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .page { max-width: 980px; margin: 0 auto; padding: 20px 14px 36px; }
      .header { padding: 8px 2px 16px; }
      .eyebrow { margin: 0 0 6px; color: #1d4ed8; font-size: 13px; font-weight: 700; }
      h1 { margin: 0; font-size: 24px; line-height: 1.3; }
      .desc { margin: 8px 0 0; color: #64748b; font-size: 14px; line-height: 1.65; }
      .toolbar {
        display: grid;
        gap: 10px;
        margin: 10px 0 14px;
      }
      .search {
        width: 100%;
        border: 1px solid #dbe3ef;
        border-radius: 10px;
        background: #fff;
        padding: 12px 13px;
        color: #111827;
        font: inherit;
        font-size: 15px;
      }
      .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
      .category-filters { display: flex; gap: 8px; padding-bottom: 2px; }
      .filter {
        border: 1px solid #dbe3ef;
        border-radius: 999px;
        background: #fff;
        color: #475569;
        padding: 8px 12px;
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
      }
      .filter.active { background: #111827; border-color: #111827; color: #fff; }
      .category-filter {
        display: flex;
        flex: 1 1 0;
        align-items: center;
        justify-content: center;
        min-width: 0;
        height: 44px;
        min-height: 44px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #fff;
        color: #334155;
        padding: 8px 12px;
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
      }
      .category-filter[data-category="positive"].active { background: #047857; border-color: #047857; color: #fff; }
      .category-filter[data-category="negative"].active { background: #be123c; border-color: #be123c; color: #fff; }
      .category-filter[data-category="other"].active { background: #334155; border-color: #334155; color: #fff; }
      .taxonomy-filters { display: grid; gap: 10px; }
      .taxonomy-group { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; align-items: start; }
      .taxonomy-label { padding-top: 7px; color: #64748b; font-size: 12px; font-weight: 700; }
      .taxonomy-options { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 2px; }
      .taxonomy-option {
        flex: 0 0 auto;
        min-height: 34px;
        border: 1px solid #dbe3ef;
        border-radius: 7px;
        background: #fff;
        color: #475569;
        padding: 7px 10px;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }
      .taxonomy-option.active { background: #111827; border-color: #111827; color: #fff; }
      .message {
        margin: 12px 0;
        padding: 14px;
        border: 1px solid #dbe3ef;
        border-radius: 12px;
        background: #fff;
        color: #475569;
        font-size: 14px;
        line-height: 1.7;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 12px 0 14px;
      }
      .stat {
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        background: #fff;
        padding: 10px;
      }
      .stat span { display: block; color: #64748b; font-size: 12px; }
      .stat strong { display: block; margin-top: 4px; font-size: 22px; }
      .list { display: grid; gap: 12px; }
      .card {
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        background: #fff;
        padding: 14px;
        box-shadow: 0 1px 4px rgba(15, 23, 42, 0.05);
      }
      .card-head { display: flex; gap: 12px; align-items: flex-start; }
      .icon {
        flex: 0 0 auto;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
      }
      .icon.video { background: #eef2ff; color: #4f46e5; }
      .icon.document { background: #ecfdf5; color: #059669; }
      .main { min-width: 0; flex: 1; }
      .title { margin: 0; font-size: 16px; line-height: 1.45; font-weight: 800; word-break: break-word; }
      .meta { margin: 5px 0 0; color: #94a3b8; font-size: 12px; line-height: 1.5; }
      .course { margin: 7px 0 0; color: #475569; font-size: 13px; line-height: 1.5; }
      .tag {
        display: inline-block;
        margin-top: 9px;
        border-radius: 6px;
        border: 1px solid transparent;
        padding: 3px 8px;
        font-size: 12px;
        font-weight: 700;
      }
      .tag-positive { background: #ecfdf5; border-color: #a7f3d0; color: #047857; }
      .tag-negative { background: #fff1f2; border-color: #fecdd3; color: #be123c; }
      .tag-other { background: #f1f5f9; border-color: #cbd5e1; color: #475569; }
      .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
      .tags .tag { margin-top: 0; }
      .tag-task { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }
      .tag-scene { background: #ecfdf5; border-color: #a7f3d0; color: #047857; }
      .tag-quality { background: #f8fafc; border-color: #cbd5e1; color: #475569; }
      .tag-severity { background: #fff7ed; border-color: #fed7aa; color: #c2410c; }
      .actions {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-top: 12px;
      }
      a.button, button.button {
        appearance: none;
        border: 1px solid #dbe3ef;
        border-radius: 9px;
        background: #fff;
        color: #334155;
        padding: 10px 8px;
        text-align: center;
        text-decoration: none;
        font-size: 13px;
        font-weight: 800;
      }
      a.button.primary, button.button.primary { border-color: #111827; background: #111827; color: #fff; }
      .admin-link {
        display: none;
        margin-top: 12px;
        color: #1d4ed8;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }
      .empty { text-align: center; color: #64748b; padding: 40px 12px; }
      @media (min-width: 720px) {
        .toolbar { grid-template-columns: 1fr auto; align-items: center; }
        .category-filters { grid-column: 1 / -1; }
        .list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="header">
        <p class="eyebrow">员工培训资料库</p>
        <h1>视频分享</h1>
        <p class="desc">无需登录即可打开培训视频和文档。可在微信、Safari、安卓和鸿蒙浏览器中使用。</p>
        <a id="admin-link" class="admin-link" href="/video-sharing/manage">进入管理后台</a>
      </section>

      <section class="stats">
        <div class="stat"><span>全部资料</span><strong id="stat-all">0</strong></div>
        <div class="stat"><span>视频</span><strong id="stat-video">0</strong></div>
        <div class="stat"><span>文档</span><strong id="stat-doc">0</strong></div>
      </section>

      <section class="toolbar">
        <div id="category-filters" class="category-filters" role="tablist" aria-label="视频分类"></div>
        <div id="taxonomy-filters" class="taxonomy-filters" hidden>
          <div id="task-group" class="taxonomy-group" hidden>
            <span class="taxonomy-label">任务分类</span>
            <div id="task-filters" class="taxonomy-options" role="tablist" aria-label="任务分类"></div>
          </div>
          <div id="scene-group" class="taxonomy-group" hidden>
            <span class="taxonomy-label">场景</span>
            <div id="scene-filters" class="taxonomy-options" role="tablist" aria-label="场景"></div>
          </div>
          <div id="quality-group" class="taxonomy-group" hidden>
            <span class="taxonomy-label">质量标签</span>
            <div id="quality-filters" class="taxonomy-options" role="tablist" aria-label="质量标签"></div>
          </div>
        </div>
        <input id="search" class="search" type="search" placeholder="搜索标题、课程、分类" />
        <div class="filters" role="tablist">
          <button class="filter active" type="button" data-filter="all">全部</button>
          <button class="filter" type="button" data-filter="video">视频</button>
          <button class="filter" type="button" data-filter="document">文档</button>
          <button class="filter" type="button" data-filter="pdf">PDF</button>
          <button class="filter" type="button" data-filter="word">Word</button>
        </div>
      </section>

      <section id="message" class="message">正在加载培训资料，请稍候。</section>
      <section id="list" class="list"></section>
    </main>

    <script>
      (function () {
        var listEl = document.getElementById('list');
        var messageEl = document.getElementById('message');
        var searchEl = document.getElementById('search');
        var categoryFiltersEl = document.getElementById('category-filters');
        var taxonomyFiltersEl = document.getElementById('taxonomy-filters');
        var taskGroupEl = document.getElementById('task-group');
        var sceneGroupEl = document.getElementById('scene-group');
        var qualityGroupEl = document.getElementById('quality-group');
        var taskFiltersEl = document.getElementById('task-filters');
        var sceneFiltersEl = document.getElementById('scene-filters');
        var qualityFiltersEl = document.getElementById('quality-filters');
        var activeFilter = 'all';
        var activeCategory = 'positive';
        var activeTask = 'all';
        var activeScene = 'all';
        var activeQuality = 'all';
        var assets = [];

        function getStoredToken() {
          try { return window.localStorage.getItem('em-box.auth-token'); } catch (_) { return ''; }
        }

        function showAdminLinkIfLoggedIn() {
          if (getStoredToken()) document.getElementById('admin-link').style.display = 'inline-block';
        }

        function getExtension(url) {
          if (!url) return '';
          try {
            var parsed = new URL(url, window.location.origin);
            return (decodeURIComponent(parsed.pathname).split('.').pop() || '').toLowerCase();
          } catch (_) {
            return ((url.split('?')[0] || '').split('.').pop() || '').toLowerCase();
          }
        }

        function isVideoUrl(url) {
          return ['mp4', 'm4v', 'mov', 'webm', 'avi', 'mkv'].indexOf(getExtension(url)) !== -1;
        }

        function getDocumentLabel(ext) {
          if (ext === 'pdf') return 'PDF';
          if (ext === 'doc' || ext === 'docx') return 'Word';
          if (ext === 'ppt' || ext === 'pptx') return 'PPT';
          if (ext === 'xls' || ext === 'xlsx') return '表格';
          if (['jpg', 'jpeg', 'png', 'gif', 'webp'].indexOf(ext) !== -1) return '图片';
          return '文档';
        }

        function buildSharePath(courseId, token, targetUrl) {
          var base = '/tv/' + encodeURIComponent(courseId) + '/' + encodeURIComponent(token);
          if (!targetUrl) return base;
          var encoded = encodeURIComponent(targetUrl);
          return base + '?target=' + encoded + '#target=' + encoded;
        }

        function buildDocPreviewPath(asset) {
          return '/training/docs/pdf?file=' + encodeURIComponent(asset.url)
            + '&title=' + encodeURIComponent(asset.title)
            + '&type=' + encodeURIComponent(asset.extension || asset.kindLabel);
        }

        function assetUrl(asset) {
          if (asset.kind === 'document') return buildDocPreviewPath(asset);
          return buildSharePath(asset.courseId, asset.token, asset.url);
        }

        function wholeCourseUrl(asset) {
          return buildSharePath(asset.courseId, asset.token);
        }

        function copyText(text, done) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () {
              done();
            }).catch(function () {
              window.prompt('复制下面的培训链接', text);
              done();
            });
            return;
          }
          window.prompt('复制下面的培训链接', text);
          done();
        }

        function requestJson(url, onSuccess, onError) {
          if (window.fetch) {
            fetch(url, { cache: 'no-store' })
              .then(function (response) {
                return response.json().then(function (data) {
                  if (!response.ok) throw new Error((data.error && data.error.message) || '培训资料加载失败');
                  return data;
                });
              })
              .then(onSuccess)
              .catch(onError);
            return;
          }

          var xhr = new XMLHttpRequest();
          xhr.open('GET', url, true);
          xhr.setRequestHeader('Accept', 'application/json');
          xhr.onreadystatechange = function () {
            if (xhr.readyState !== 4) return;
            var data = null;
            try {
              data = JSON.parse(xhr.responseText || '{}');
            } catch (e) {
              onError(new Error('培训资料加载失败'));
              return;
            }
            if (xhr.status < 200 || xhr.status >= 300) {
              onError(new Error((data.error && data.error.message) || '培训资料加载失败'));
              return;
            }
            onSuccess(data);
          };
          xhr.onerror = function () {
            onError(new Error('网络出错，请稍后重试。'));
          };
          xhr.send();
        }

        function getCourseItems(course) {
          var items = [];
          var content = Array.isArray(course.content) ? course.content : [];
          for (var i = 0; i < content.length; i += 1) {
            var contentUrl = content[i].contentUrl || content[i].content_url || '';
            if (!contentUrl) continue;
            items.push({
              title: content[i].sectionTitle || content[i].section_title || ('章节 ' + (i + 1)),
              url: contentUrl,
              sourceLabel: '章节 ' + (i + 1)
            });
          }
          var materials = Array.isArray(course.materials) ? course.materials : [];
          for (var j = 0; j < materials.length; j += 1) {
            if (!materials[j].url) continue;
            items.push({
              title: materials[j].title || ('资料 ' + (j + 1)),
              url: materials[j].url,
              sourceLabel: '资料 ' + (j + 1)
            });
          }
          return items;
        }

        function normalizeCourses(payload) {
          var courses = Array.isArray(payload.items) ? payload.items : [];
          var result = [];
          for (var i = 0; i < courses.length; i += 1) {
            var course = courses[i];
            var token = course.share_token || course.shareToken || '';
            if (!token) continue;
            var explicitPolarity = course.video_polarity || course.videoPolarity || '';
            var taskCategory = course.task_category || course.taskCategory || null;
            var scene = course.video_scene || course.scene || null;
            var rawQualityTags = course.quality_tags || course.qualityTags || [];
            var qualityTags = [];
            if (Array.isArray(rawQualityTags)) {
              for (var tagIndex = 0; tagIndex < rawQualityTags.length; tagIndex += 1) {
                if (!rawQualityTags[tagIndex] || !rawQualityTags[tagIndex].id) continue;
                qualityTags.push({
                  id: String(rawQualityTags[tagIndex].id),
                  name: String(rawQualityTags[tagIndex].name || '')
                });
              }
            }
            var items = getCourseItems(course);
            for (var j = 0; j < items.length; j += 1) {
              var ext = getExtension(items[j].url);
              var isVideo = isVideoUrl(items[j].url);
              var kindLabel = isVideo ? '视频' : getDocumentLabel(ext);
              result.push({
                id: course.id + '::' + j,
                courseId: course.id,
                token: token,
                courseTitle: course.title || '培训资料',
                courseDescription: course.description || '',
                category: course.category || '综合',
                polarity: explicitPolarity,
                taskCategory: taskCategory && taskCategory.id ? {
                  id: String(taskCategory.id), name: String(taskCategory.name || '')
                } : null,
                scene: scene && scene.id ? {
                  id: String(scene.id), name: String(scene.name || '')
                } : null,
                qualityTags: qualityTags,
                severity: course.video_severity || course.videoSeverity || '',
                reviewNote: course.video_review_note || course.videoReviewNote || '',
                title: items[j].title,
                url: items[j].url,
                sourceLabel: items[j].sourceLabel,
                kind: isVideo ? 'video' : 'document',
                kindLabel: kindLabel,
                extension: ext,
                searchText: [
                  course.title, course.description, course.category, items[j].title, kindLabel, ext,
                  taskCategory && taskCategory.name, scene && scene.name, qualityTags.map(function (tag) { return tag.name; }).join(' '),
                  course.video_review_note || course.videoReviewNote
                ].join(' ').toLowerCase()
              });
            }
          }
          return result;
        }

        function updateStats() {
          document.getElementById('stat-all').textContent = String(assets.length);
          document.getElementById('stat-video').textContent = String(assets.filter(function (a) { return a.kind === 'video'; }).length);
          document.getElementById('stat-doc').textContent = String(assets.filter(function (a) { return a.kind === 'document'; }).length);
        }

        function categoryGroup(asset) {
          if (asset.kind !== 'video') return 'other';
          if (asset.polarity === 'positive') return 'positive';
          if (asset.polarity === 'negative') return 'negative';
          if (asset.category === '正向视频') return 'positive';
          if (asset.category === '负向视频' || asset.category === '负面视频') return 'negative';
          return 'other';
        }

        function renderCategoryFilters() {
          var categories = [
            {id: 'positive', label: '正向视频'},
            {id: 'negative', label: '负向视频'}
          ];
          var otherCount = assets.filter(function (asset) { return categoryGroup(asset) === 'other'; }).length;
          if (otherCount) categories.push({id: 'other', label: '其他资料'});
          if (!categories.some(function (category) { return category.id === activeCategory; })) activeCategory = 'positive';
          categoryFiltersEl.innerHTML = '';
          for (var i = 0; i < categories.length; i += 1) {
            var category = categories[i];
            var count = assets.filter(function (asset) { return categoryGroup(asset) === category.id; }).length;
            var button = document.createElement('button');
            button.type = 'button';
            button.className = 'category-filter' + (activeCategory === category.id ? ' active' : '');
            button.setAttribute('data-category', category.id);
            button.setAttribute('aria-pressed', activeCategory === category.id ? 'true' : 'false');
            button.textContent = category.label + ' ' + count;
            button.addEventListener('click', function () {
              activeCategory = this.getAttribute('data-category') || 'positive';
              activeTask = 'all';
              activeScene = 'all';
              activeQuality = 'all';
              renderCategoryFilters();
              renderTaxonomyFilters();
              render();
            });
            categoryFiltersEl.appendChild(button);
          }
        }

        function uniqueOptions(items, selector) {
          var seen = {};
          var result = [];
          for (var i = 0; i < items.length; i += 1) {
            var values = selector(items[i]) || [];
            for (var j = 0; j < values.length; j += 1) {
              var value = values[j];
              if (!value || !value.id || seen[value.id]) continue;
              seen[value.id] = true;
              result.push(value);
            }
          }
          return result.sort(function (a, b) { return a.name.localeCompare(b.name, 'zh-CN'); });
        }

        function renderTaxonomyOption(container, id, label, count, attribute, isActive, onClick) {
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'taxonomy-option' + (isActive ? ' active' : '');
          button.setAttribute(attribute, id);
          button.setAttribute('aria-pressed', isActive ? 'true' : 'false');
          button.textContent = label + ' ' + count;
          button.addEventListener('click', onClick);
          container.appendChild(button);
        }

        function renderTaxonomyFilters() {
          var scoped = assets.filter(function (asset) { return categoryGroup(asset) === activeCategory; });
          var tasks = uniqueOptions(scoped, function (asset) { return asset.taskCategory ? [asset.taskCategory] : []; });
          var scenes = uniqueOptions(scoped, function (asset) { return asset.scene ? [asset.scene] : []; });
          var qualityTags = uniqueOptions(scoped, function (asset) { return asset.qualityTags; });
          if (activeTask !== 'all' && !tasks.some(function (task) { return task.id === activeTask; })) activeTask = 'all';
          if (activeScene !== 'all' && !scenes.some(function (scene) { return scene.id === activeScene; })) activeScene = 'all';
          if (activeQuality !== 'all' && !qualityTags.some(function (tag) { return tag.id === activeQuality; })) activeQuality = 'all';

          taskFiltersEl.innerHTML = '';
          sceneFiltersEl.innerHTML = '';
          qualityFiltersEl.innerHTML = '';
          taskGroupEl.hidden = tasks.length === 0;
          sceneGroupEl.hidden = scenes.length === 0;
          qualityGroupEl.hidden = qualityTags.length === 0;
          taxonomyFiltersEl.hidden = tasks.length === 0 && scenes.length === 0 && qualityTags.length === 0;

          if (tasks.length) {
            renderTaxonomyOption(taskFiltersEl, 'all', '全部任务', scoped.length, 'data-task', activeTask === 'all', function () {
              activeTask = 'all'; renderTaxonomyFilters(); render();
            });
            for (var i = 0; i < tasks.length; i += 1) {
              (function (task) {
                var count = scoped.filter(function (asset) { return asset.taskCategory && asset.taskCategory.id === task.id; }).length;
                renderTaxonomyOption(taskFiltersEl, task.id, task.name, count, 'data-task', activeTask === task.id, function () {
                  activeTask = task.id; renderTaxonomyFilters(); render();
                });
              })(tasks[i]);
            }
          }

          if (scenes.length) {
            renderTaxonomyOption(sceneFiltersEl, 'all', '全部场景', scoped.length, 'data-scene', activeScene === 'all', function () {
              activeScene = 'all'; renderTaxonomyFilters(); render();
            });
            for (var sceneIndex = 0; sceneIndex < scenes.length; sceneIndex += 1) {
              (function (scene) {
                var count = scoped.filter(function (asset) { return asset.scene && asset.scene.id === scene.id; }).length;
                renderTaxonomyOption(sceneFiltersEl, scene.id, scene.name, count, 'data-scene', activeScene === scene.id, function () {
                  activeScene = scene.id; renderTaxonomyFilters(); render();
                });
              })(scenes[sceneIndex]);
            }
          }

          if (qualityTags.length) {
            renderTaxonomyOption(qualityFiltersEl, 'all', '全部标签', scoped.length, 'data-quality', activeQuality === 'all', function () {
              activeQuality = 'all'; renderTaxonomyFilters(); render();
            });
            for (var j = 0; j < qualityTags.length; j += 1) {
              (function (qualityTag) {
                var count = scoped.filter(function (asset) {
                  return asset.qualityTags.some(function (tag) { return tag.id === qualityTag.id; });
                }).length;
                renderTaxonomyOption(qualityFiltersEl, qualityTag.id, qualityTag.name, count, 'data-quality', activeQuality === qualityTag.id, function () {
                  activeQuality = qualityTag.id; renderTaxonomyFilters(); render();
                });
              })(qualityTags[j]);
            }
          }
        }

        function severityLabel(value) {
          if (value === 'minor') return '轻微';
          if (value === 'moderate') return '明显';
          if (value === 'severe') return '严重';
          return '';
        }

        function render() {
          var query = (searchEl.value || '').trim().toLowerCase();
          var filtered = assets.filter(function (asset) {
            var inCategory = categoryGroup(asset) === activeCategory;
            var taskMatched = activeTask === 'all' || (asset.taskCategory && asset.taskCategory.id === activeTask);
            var sceneMatched = activeScene === 'all' || (asset.scene && asset.scene.id === activeScene);
            var qualityMatched = activeQuality === 'all'
              || asset.qualityTags.some(function (tag) { return tag.id === activeQuality; });
            var kindMatched = activeFilter === 'all'
              || asset.kind === activeFilter
              || (activeFilter === 'pdf' && asset.extension === 'pdf')
              || (activeFilter === 'word' && (asset.extension === 'doc' || asset.extension === 'docx'));
            var queryMatched = !query || asset.searchText.indexOf(query) !== -1;
            return inCategory && taskMatched && sceneMatched && qualityMatched && kindMatched && queryMatched;
          });
          listEl.innerHTML = '';
          if (!filtered.length) {
            listEl.innerHTML = '<div class="empty">没有找到匹配的培训资料。</div>';
            return;
          }
          for (var i = 0; i < filtered.length; i += 1) {
            var asset = filtered[i];
            var openUrl = assetUrl(asset);
            var courseUrl = wholeCourseUrl(asset);
            var card = document.createElement('article');
            card.className = 'card';
            card.innerHTML =
              '<div class="card-head">'
              + '<div class="icon ' + asset.kind + '">' + (asset.kind === 'video' ? '▶' : '文') + '</div>'
              + '<div class="main">'
              + '<p class="title"></p>'
              + '<p class="meta"></p>'
              + '<p class="course"></p>'
              + '<div class="tags"></div>'
              + '</div></div>'
              + '<div class="actions">'
              + '<a class="button primary" target="_blank" rel="noreferrer">打开</a>'
              + '<button class="button" type="button">复制</button>'
              + '<a class="button" target="_blank" rel="noreferrer">整课</a>'
              + '</div>';
            card.querySelector('.title').textContent = asset.title;
            card.querySelector('.meta').textContent = asset.kindLabel + ' · ' + (asset.extension || 'file') + ' · ' + asset.sourceLabel;
            card.querySelector('.course').textContent = asset.courseTitle;
            var tags = card.querySelector('.tags');
            var polarityTag = document.createElement('span');
            polarityTag.className = 'tag tag-' + categoryGroup(asset);
            polarityTag.textContent = categoryGroup(asset) === 'positive' ? '正向视频'
              : categoryGroup(asset) === 'negative' ? '负向视频' : asset.category;
            tags.appendChild(polarityTag);
            if (asset.taskCategory) {
              var taskTag = document.createElement('span');
              taskTag.className = 'tag tag-task';
              taskTag.textContent = asset.taskCategory.name;
              tags.appendChild(taskTag);
            }
            if (asset.scene) {
              var sceneTag = document.createElement('span');
              sceneTag.className = 'tag tag-scene';
              sceneTag.textContent = asset.scene.name;
              tags.appendChild(sceneTag);
            }
            for (var tagIndex = 0; tagIndex < Math.min(2, asset.qualityTags.length); tagIndex += 1) {
              var qualityTag = document.createElement('span');
              qualityTag.className = 'tag tag-quality';
              qualityTag.textContent = asset.qualityTags[tagIndex].name;
              tags.appendChild(qualityTag);
            }
            if (asset.qualityTags.length > 2) {
              var overflowTag = document.createElement('span');
              overflowTag.className = 'tag tag-quality';
              overflowTag.textContent = '+' + (asset.qualityTags.length - 2);
              tags.appendChild(overflowTag);
            }
            var severity = severityLabel(asset.severity);
            if (severity) {
              var severityTag = document.createElement('span');
              severityTag.className = 'tag tag-severity';
              severityTag.textContent = severity;
              tags.appendChild(severityTag);
            }
            var links = card.querySelectorAll('a.button');
            links[0].href = openUrl;
            links[1].href = courseUrl;
            (function (button, url) {
              button.addEventListener('click', function () {
                copyText(window.location.origin + url, function () {
                  button.textContent = '已复制';
                  window.setTimeout(function () { button.textContent = '复制'; }, 1500);
                });
              });
            })(card.querySelector('button.button'), openUrl);
            listEl.appendChild(card);
          }
        }

        Array.prototype.forEach.call(document.querySelectorAll('.filter'), function (button) {
          button.addEventListener('click', function () {
            activeFilter = button.getAttribute('data-filter') || 'all';
            Array.prototype.forEach.call(document.querySelectorAll('.filter'), function (node) {
              node.classList.toggle('active', node === button);
            });
            render();
          });
        });
        searchEl.addEventListener('input', render);
        showAdminLinkIfLoggedIn();

        requestJson('/training-public-api/courses',
          function (data) {
            assets = normalizeCourses(data);
            updateStats();
            renderCategoryFilters();
            renderTaxonomyFilters();
            messageEl.textContent = assets.length ? '请选择需要学习的资料。' : '暂无可打开的培训资料。';
            render();
          },
          function (error) {
            messageEl.textContent = error && error.message ? error.message : '网络出错，请稍后重试。';
          });
      })();
    </script>
  </body>
</html>
