<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>培训视频</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f8fafc;
        color: #111827;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .page {
        max-width: 860px;
        margin: 0 auto;
        padding: 20px 14px 32px;
      }
      .header {
        padding: 4px 2px 14px;
      }
      .label {
        margin: 0 0 6px;
        color: #4f46e5;
        font-size: 13px;
        font-weight: 600;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.35;
      }
      .desc {
        margin: 8px 0 0;
        color: #6b7280;
        font-size: 14px;
        line-height: 1.6;
      }
      .player {
        position: relative;
        width: 100%;
        margin-top: 8px;
        background: #000;
        border-radius: 10px;
        overflow: hidden;
      }
      video {
        display: block;
        width: 100%;
        min-height: 220px;
        max-height: 72vh;
        background: #000;
      }
      .play-overlay {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 999px;
        padding: 13px 20px;
        background: rgba(255, 255, 255, 0.92);
        color: #111827;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
      }
      .message {
        margin-top: 14px;
        padding: 14px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        background: #fff;
        color: #4b5563;
        font-size: 14px;
        line-height: 1.7;
      }
      .live-caption {
        margin-top: 10px;
        padding: 12px 14px;
        border: 1px solid #dbeafe;
        border-radius: 10px;
        background: #eff6ff;
        color: #1e3a8a;
        font-size: 15px;
        font-weight: 650;
        line-height: 1.6;
      }
      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      a, button {
        appearance: none;
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        background: #111827;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
      button.secondary, a.secondary {
        background: #e5e7eb;
        color: #111827;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin-top: 16px;
        padding: 4px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        background: #fff;
      }
      .tab {
        flex: 1;
        background: transparent;
        color: #4b5563;
      }
      .tab.active {
        background: #111827;
        color: #fff;
      }
      .panel {
        margin-top: 12px;
        padding: 14px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        background: #fff;
      }
      .transcript-item {
        padding: 12px 0;
        border-bottom: 1px solid #f3f4f6;
      }
      .transcript-item:last-child {
        border-bottom: 0;
      }
      .transcript-title {
        margin: 0 0 6px;
        font-size: 14px;
        font-weight: 700;
      }
      .transcript-text {
        margin: 0;
        white-space: pre-wrap;
        color: #4b5563;
        font-size: 14px;
        line-height: 1.75;
      }
      .action-item {
        display: block;
        width: 100%;
        text-align: left;
        padding: 12px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        background: #fff;
        color: #111827;
        margin-bottom: 10px;
      }
      .action-item.active {
        border-color: #93c5fd;
        background: #eff6ff;
      }
      .action-time {
        margin: 0 0 4px;
        color: #6b7280;
        font-size: 12px;
        font-weight: 700;
      }
      .action-title {
        margin: 0;
        color: #111827;
        font-size: 15px;
        font-weight: 800;
      }
      .action-desc {
        margin: 6px 0 0;
        color: #4b5563;
        font-size: 14px;
        line-height: 1.65;
      }
      .action-meta {
        margin: 8px 0 0;
        color: #4b5563;
        font-size: 12px;
        line-height: 1.6;
      }
      .action-meta span {
        display: inline-block;
        margin-right: 10px;
      }
      .live-caption strong {
        display: block;
        color: #111827;
        font-size: 16px;
        margin-bottom: 4px;
      }
      .live-caption small {
        display: block;
        color: #4b5563;
        font-size: 12px;
        font-weight: 500;
        line-height: 1.5;
        margin-top: 6px;
      }
      textarea {
        display: block;
        width: 100%;
        min-height: 92px;
        resize: vertical;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        padding: 10px;
        color: #111827;
        font: inherit;
      }
      .note {
        margin-top: 12px;
        padding: 12px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: #f9fafb;
      }
      .note-meta {
        margin: 0 0 6px;
        color: #6b7280;
        font-size: 12px;
      }
      .note-text {
        margin: 0;
        white-space: pre-wrap;
        color: #374151;
        font-size: 14px;
        line-height: 1.65;
      }
      .document-list {
        margin-top: 14px;
        display: grid;
        gap: 12px;
      }
      .document-card {
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        background: #fff;
        padding: 16px;
      }
      .document-title {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.45;
      }
      .document-type {
        margin: 6px 0 0;
        color: #6b7280;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .document-preview {
        margin-top: 14px;
        width: 100%;
        min-height: 68vh;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        background: #f9fafb;
        overflow: hidden;
      }
      .document-preview iframe {
        display: block;
        width: 100%;
        height: 68vh;
        border: 0;
        background: #fff;
      }
      .document-preview img {
        display: block;
        width: 100%;
        height: auto;
        background: #fff;
      }
      .document-preview-fallback {
        padding: 18px;
        color: #6b7280;
        font-size: 14px;
        line-height: 1.7;
      }
      .document-note {
        margin: 10px 0 0;
        color: #6b7280;
        font-size: 13px;
        line-height: 1.6;
      }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="header">
        <p class="label">员工培训视频</p>
        <h1 id="course-title">正在加载...</h1>
        <p id="course-desc" class="desc"></p>
      </section>

      <section id="player" class="player hidden">
        <video
          id="video"
          controls
          playsinline
          webkit-playsinline
          x5-playsinline
          x5-video-player-type="h5-page"
          preload="metadata"
        ></video>
        <button id="play-button" class="play-overlay" type="button">播放视频</button>
      </section>

      <section id="message" class="message">正在加载培训视频，请稍候。</section>
      <section id="document-panel" class="document-list hidden"></section>
      <section id="live-caption" class="live-caption hidden">动作流准备中。</section>
      <section id="actions" class="actions hidden">
        <a id="open-video" class="secondary" target="_blank" rel="noreferrer">视频打不开时使用</a>
        <button class="secondary" type="button" onclick="window.location.reload()">刷新</button>
      </section>

      <section id="tabs" class="tabs hidden">
        <button id="tab-actions" class="tab" type="button">动作流</button>
        <button id="tab-transcript" class="tab active" type="button">文字稿</button>
        <button id="tab-notes" class="tab" type="button">笔记</button>
      </section>

      <section id="actions-panel" class="panel hidden">
        <div id="actions-content"></div>
      </section>

      <section id="transcript-panel" class="panel hidden">
        <div id="transcript-content"></div>
      </section>

      <section id="notes-panel" class="panel hidden">
        <textarea id="note-input" placeholder="记录当前学习笔记"></textarea>
        <div class="actions">
          <button id="save-note" type="button">保存笔记</button>
        </div>
        <div id="notes-list"></div>
      </section>
    </main>

    <script src="/training-video-compatibility.js"></script>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var hashParams = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
        var courseId = params.get('courseId') || '';
        var token = params.get('token') || '';
        var targetUrl = params.get('target') || hashParams.get('target') || '';
        function extractTrainingShareFromText(value) {
          if (!value) return null;
          var decoded = value;
          try {
            decoded = decodeURIComponent(value);
          } catch (_) {
            decoded = value;
          }
          var matches = Array.from(decoded.matchAll(/\/tv\/([0-9a-f-]{36})\/([A-Za-z0-9_-]{20,})/g));
          if (!matches.length) return null;
          var match = matches[matches.length - 1];
          return { courseId: match[1], token: match[2] };
        }
        if (!courseId || !token) {
          var pathShare = extractTrainingShareFromText(window.location.pathname);
          var queryShare = extractTrainingShareFromText(params.get('sharePath') || '');
          var recoveredShare = queryShare || pathShare;
          if (recoveredShare) {
            courseId = recoveredShare.courseId;
            token = recoveredShare.token;
          } else {
            var pathMatch = window.location.pathname.match(/^\/tv\/([^/]+)\/([^/]+)/);
            if (pathMatch) {
              courseId = decodeURIComponent(pathMatch[1]);
              token = decodeURIComponent(pathMatch[2]);
            }
          }
        }
        var titleEl = document.getElementById('course-title');
        var descEl = document.getElementById('course-desc');
        var labelEl = document.querySelector('.label');
        var messageEl = document.getElementById('message');
        var documentPanelEl = document.getElementById('document-panel');
        var playerEl = document.getElementById('player');
        var videoEl = document.getElementById('video');
        var playButtonEl = document.getElementById('play-button');
        var actionsEl = document.getElementById('actions');
        var openVideoEl = document.getElementById('open-video');
        var liveCaptionEl = document.getElementById('live-caption');
        var tabsEl = document.getElementById('tabs');
        var tabActionsEl = document.getElementById('tab-actions');
        var tabTranscriptEl = document.getElementById('tab-transcript');
        var tabNotesEl = document.getElementById('tab-notes');
        var actionsPanelEl = document.getElementById('actions-panel');
        var actionsContentEl = document.getElementById('actions-content');
        var transcriptPanelEl = document.getElementById('transcript-panel');
        var transcriptContentEl = document.getElementById('transcript-content');
        var notesPanelEl = document.getElementById('notes-panel');
        var noteInputEl = document.getElementById('note-input');
        var saveNoteEl = document.getElementById('save-note');
        var notesListEl = document.getElementById('notes-list');
        var playTimeout = null;
        var bufferingTimer = null;
        var lastPlaybackTime = 0;
        var videoCandidates = [];
        var videoCandidateIndex = 0;
        var sourceVersion = 0;
        var playAttempt = 0;
        var requestedPlayback = false;
        var exhaustedCandidates = false;
        var resumeTime = 0;
        var actionCaptions = [];

        function setMessage(text) {
          messageEl.textContent = text;
        }

        function toProxyUrl(url) {
          if (!url) return '';
          var marker = '/storage/v1/object/public/training-materials/';
          var markerIndex = url.indexOf(marker);
          if (markerIndex === -1) return url;
          return window.location.origin + '/training-media/' + url.slice(markerIndex + marker.length);
        }

        function getUrlExtension(url) {
          if (!url) return '';
          try {
            var parsed = new URL(url, window.location.origin);
            var path = decodeURIComponent(parsed.pathname || '');
            return (path.split('.').pop() || '').toLowerCase();
          } catch (e) {
            return ((url.split('?')[0] || '').split('.').pop() || '').toLowerCase();
          }
        }

        function isVideoUrl(url) {
          return ['mp4', 'm4v', 'mov', 'webm', 'avi', 'mkv'].indexOf(getUrlExtension(url)) !== -1;
        }

        function normalizeComparableUrl(url) {
          return toProxyUrl(url || '').split('?')[0];
        }

        function getAbsoluteUrl(url) {
          try {
            return new URL(url, window.location.href).href;
          } catch (e) {
            return url;
          }
        }

        function getDocumentPreviewUrl(rawUrl, title) {
          var proxiedUrl = toProxyUrl(rawUrl);
          var ext = getUrlExtension(proxiedUrl);
          return '/training/docs/pdf?file=' + encodeURIComponent(proxiedUrl)
            + '&type=' + encodeURIComponent(ext || 'document')
            + '&title=' + encodeURIComponent(title || '培训文档');
        }

        function getPreviewInfo(rawUrl) {
          var proxiedUrl = toProxyUrl(rawUrl);
          var ext = getUrlExtension(proxiedUrl);
          if (['doc', 'docx', 'ppt', 'pptx', 'xls', 'xlsx'].indexOf(ext) !== -1) {
            if (isWeChatBrowser()) {
              return {
                type: 'fallback',
                url: proxiedUrl,
                openUrl: getDocumentPreviewUrl(rawUrl),
                openLabel: '预览文档',
                downloadLabel: '下载文件',
                note: '微信内置浏览器将使用兼容预览打开 Office 文档。'
              };
            }
            var absolute = getAbsoluteUrl(proxiedUrl);
            return {
              type: 'iframe',
              url: 'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(absolute),
              openUrl: 'https://view.officeapps.live.com/op/view.aspx?src=' + encodeURIComponent(absolute),
              openLabel: '在线预览',
              downloadLabel: '下载文件',
              note: 'Word/Office 文件使用在线预览服务打开。'
            };
          }
          if (ext === 'pdf') {
            return {
              type: 'iframe',
              url: proxiedUrl,
              openUrl: proxiedUrl,
              fallbackUrl: getDocumentPreviewUrl(rawUrl),
              note: 'PDF 优先使用高清原文预览；如果微信内无法显示，请使用兼容预览。'
            };
          }
          if (['txt', 'md'].indexOf(ext) !== -1) {
            return { type: 'iframe', url: proxiedUrl, openUrl: proxiedUrl };
          }
          if (['jpg', 'jpeg', 'png', 'gif', 'webp'].indexOf(ext) !== -1) {
            return { type: 'image', url: proxiedUrl, openUrl: proxiedUrl };
          }
          return { type: 'fallback', url: proxiedUrl, openUrl: proxiedUrl };
        }

        function isIOSDevice() {
          var ua = navigator.userAgent || '';
          return /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && 'ontouchend' in document);
        }

        function isWeChatBrowser() {
          return /MicroMessenger/i.test(navigator.userAgent || '');
        }

        function selectVideoUrl(rawUrl) {
          var proxyUrl = toProxyUrl(rawUrl);
          videoCandidates = window.TrainingVideoCompatibility
            ? window.TrainingVideoCompatibility.candidates(rawUrl, {
              origin: window.location.origin,
              userAgent: navigator.userAgent || '',
              touchPoints: navigator.maxTouchPoints || (isIOSDevice() ? 2 : 0)
            })
            : [rawUrl, proxyUrl].filter(function (url, index, urls) { return url && urls.indexOf(url) === index; });
          videoCandidateIndex = 0;
          exhaustedCandidates = false;
          return videoCandidates[0] || '';
        }

        function loadCandidate(index) {
          clearPlaybackTimers();
          sourceVersion += 1;
          videoCandidateIndex = index;
          lastPlaybackTime = 0;
          videoEl.pause();
          videoEl.src = videoCandidates[index];
          videoEl.load();
        }

        function switchToFallbackVideo(reason) {
          if (videoCandidateIndex + 1 >= videoCandidates.length) {
            exhaustedCandidates = true;
            return false;
          }
          resumeTime = videoEl.currentTime || resumeTime;
          loadCandidate(videoCandidateIndex + 1);
          playButtonEl.textContent = '播放视频';
          playButtonEl.classList.remove('hidden');
          setMessage(reason + ' 已切换视频线路。');
          if (requestedPlayback) startPlayback();
          return true;
        }

        function findVideoUrl(course) {
          var content = Array.isArray(course.content) ? course.content : [];
          for (var i = content.length - 1; i >= 0; i -= 1) {
            var contentUrl = content[i].contentUrl || content[i].content_url || '';
            var contentType = content[i].contentType || content[i].content_type;
            if (contentType === 'video' && contentUrl && isVideoUrl(contentUrl)) return contentUrl;
          }
          var materials = Array.isArray(course.materials) ? course.materials : [];
          for (var j = materials.length - 1; j >= 0; j -= 1) {
            if (materials[j].type === 'video' && materials[j].url && isVideoUrl(materials[j].url)) return materials[j].url;
          }
          if (targetUrl && isVideoUrl(targetUrl)) return targetUrl;
          return '';
        }

        function getDocumentItems(course) {
          var docs = [];
          var content = Array.isArray(course.content) ? course.content : [];
          for (var i = 0; i < content.length; i += 1) {
            var sectionUrl = content[i].contentUrl || content[i].content_url || '';
            if (sectionUrl && !isVideoUrl(sectionUrl)) {
              docs.push({
                title: content[i].sectionTitle || content[i].section_title || '培训文档',
                url: sectionUrl,
                type: getUrlExtension(sectionUrl) || 'document'
              });
            }
          }
          var materials = Array.isArray(course.materials) ? course.materials : [];
          for (var j = 0; j < materials.length; j += 1) {
            if (materials[j].url && materials[j].type !== 'video') {
              docs.push({
                title: materials[j].title || '培训资料',
                url: materials[j].url,
                type: getUrlExtension(materials[j].url) || materials[j].type || 'document'
              });
            }
          }
          return docs;
        }

        function selectTargetDocuments(course) {
          var docs = getDocumentItems(course);
          if (!targetUrl) return docs;
          var targetComparable = normalizeComparableUrl(targetUrl);
          var matched = docs.filter(function (doc) {
            return normalizeComparableUrl(doc.url) === targetComparable;
          });
          if (matched.length) return matched;
          return [{
            title: course.title || '培训文档',
            url: targetUrl,
            type: getUrlExtension(targetUrl) || 'document'
          }];
        }

        function renderDocumentMode(course) {
          var docs = selectTargetDocuments(course);
          labelEl.textContent = '员工培训资料';
          titleEl.textContent = course.title || '培训资料';
          descEl.textContent = course.description || '';
          playerEl.classList.add('hidden');
          tabsEl.classList.add('hidden');
          actionsEl.classList.add('hidden');
          liveCaptionEl.classList.add('hidden');
          actionsPanelEl.classList.add('hidden');
          transcriptPanelEl.classList.add('hidden');
          notesPanelEl.classList.add('hidden');
          documentPanelEl.innerHTML = '';

          if (!docs.length) {
            setMessage('这个链接没有可打开的培训文档，请联系管理员重新生成链接。');
            return;
          }

          setMessage('请点击下方按钮打开或下载培训文档。');
          docs.forEach(function (doc) {
            var url = toProxyUrl(doc.url);
            var preview = getPreviewInfo(doc.url);
            var card = document.createElement('div');
            card.className = 'document-card';
            var title = document.createElement('p');
            title.className = 'document-title';
            title.textContent = doc.title || '培训文档';
            var type = document.createElement('p');
            type.className = 'document-type';
            type.textContent = doc.type || 'document';
            var note = null;
            if (preview.note) {
              note = document.createElement('p');
              note.className = 'document-note';
              note.textContent = preview.note;
            }
            var previewWrap = document.createElement('div');
            previewWrap.className = 'document-preview';
            if (preview.type === 'iframe') {
              var iframe = document.createElement('iframe');
              iframe.src = preview.url;
              iframe.title = doc.title || '培训文档预览';
              iframe.setAttribute('allowfullscreen', 'true');
              previewWrap.appendChild(iframe);
            } else if (preview.type === 'image') {
              var image = document.createElement('img');
              image.src = preview.url;
              image.alt = doc.title || '培训图片';
              previewWrap.appendChild(image);
            } else {
              var fallback = document.createElement('div');
              fallback.className = 'document-preview-fallback';
              fallback.textContent = '当前文件类型无法内嵌预览，请点击下方“新窗口预览”或“下载文件”。';
              previewWrap.appendChild(fallback);
            }
            var actionWrap = document.createElement('div');
            actionWrap.className = 'actions';
            var open = document.createElement('a');
            open.href = preview.openUrl || url;
            open.target = '_blank';
            open.rel = 'noreferrer';
            open.textContent = preview.openLabel || (preview.fallbackUrl ? '高清打开原文' : '新窗口预览');
            if (preview.fallbackUrl) {
              var fallbackOpen = document.createElement('a');
              fallbackOpen.href = preview.fallbackUrl;
              fallbackOpen.target = '_blank';
              fallbackOpen.rel = 'noreferrer';
              fallbackOpen.className = 'secondary';
              fallbackOpen.textContent = '兼容预览';
            }
            var download = document.createElement('a');
            download.href = url;
            download.setAttribute('download', '');
            download.className = 'secondary';
            download.textContent = preview.downloadLabel || (preview.fallbackUrl ? '下载原文' : '下载文件');
            actionWrap.appendChild(open);
            if (fallbackOpen) actionWrap.appendChild(fallbackOpen);
            actionWrap.appendChild(download);
            card.appendChild(title);
            card.appendChild(type);
            if (note) card.appendChild(note);
            card.appendChild(previewWrap);
            card.appendChild(actionWrap);
            documentPanelEl.appendChild(card);
          });
          documentPanelEl.classList.remove('hidden');
        }

        function getTextSections(course) {
          var content = Array.isArray(course.content) ? course.content : [];
          var sections = [];
          for (var i = 0; i < content.length; i += 1) {
            var type = content[i].contentType || content[i].content_type;
            var text = content[i].text || content[i].content || '';
            if (type === 'text' && text) {
              sections.push({
                title: content[i].sectionTitle || content[i].section_title || '文字稿',
                text: text
              });
            }
          }
          return sections;
        }

        function getCaptionListFromConfig(config, rawVideoUrl) {
          var captionsByUrl = config.actionCaptionsByUrl || config.action_captions_by_url || {};
          if (captionsByUrl && typeof captionsByUrl === 'object' && !Array.isArray(captionsByUrl)) {
            var candidates = [targetUrl, rawVideoUrl, toProxyUrl(targetUrl), toProxyUrl(rawVideoUrl)].filter(Boolean);
            for (var i = 0; i < candidates.length; i += 1) {
              if (Array.isArray(captionsByUrl[candidates[i]]) && captionsByUrl[candidates[i]].length) {
                return captionsByUrl[candidates[i]];
              }
            }
            var comparable = normalizeComparableUrl(targetUrl || rawVideoUrl);
            var keys = Object.keys(captionsByUrl);
            for (var j = 0; j < keys.length; j += 1) {
              if (normalizeComparableUrl(keys[j]) === comparable && Array.isArray(captionsByUrl[keys[j]]) && captionsByUrl[keys[j]].length) {
                return captionsByUrl[keys[j]];
              }
            }
          }
          return config.actionCaptions || config.action_captions || [];
        }

        function getActionCaptions(course, rawVideoUrl) {
          var config = course.assessmentConfig || course.assessment_config || {};
          var captions = getCaptionListFromConfig(config, rawVideoUrl);
          if (!Array.isArray(captions)) return [];
          return captions
            .map(function (item) {
              var start = Number(item.start || item.startTime || 0);
              var end = Number(item.end || item.endTime || start + 3);
              var title = String(item.title || item.actionTitle || item.action || '').trim();
              var description = String(item.description || item.detail || item.details || '').trim();
              var handAction = String(item.handAction || item.hand_action || item.hand || '').trim();
              var result = String(item.result || item.outcome || '').trim();
              var objects = Array.isArray(item.objects)
                ? item.objects.map(function (object) { return String(object || '').trim(); }).filter(Boolean).slice(0, 6)
                : [];
              var text = String(item.text || item.caption || title || '').trim();
              var confidence = item.confidence === undefined ? null : Number(item.confidence);
              if (!text) return null;
              return {
                start: start,
                end: end,
                text: text,
                title: title || text,
                description: description,
                handAction: handAction,
                objects: objects,
                result: result,
                confidence: Number.isFinite(confidence) ? confidence : null
              };
            })
            .filter(Boolean)
            .sort(function (a, b) { return a.start - b.start; });
        }

        function formatTime(seconds) {
          var value = Math.max(0, Math.floor(seconds || 0));
          var minutes = Math.floor(value / 60);
          var secs = value % 60;
          return minutes + ':' + String(secs).padStart(2, '0');
        }

        function renderTranscript(course) {
          var sections = getTextSections(course);
          transcriptContentEl.innerHTML = '';
          if (!sections.length) {
            transcriptContentEl.innerHTML = '<p class="transcript-text">暂无文字稿内容。</p>';
            return;
          }
          sections.forEach(function (section) {
            var item = document.createElement('div');
            item.className = 'transcript-item';
            var title = document.createElement('p');
            title.className = 'transcript-title';
            title.textContent = section.title;
            var text = document.createElement('p');
            text.className = 'transcript-text';
            text.textContent = section.text;
            item.appendChild(title);
            item.appendChild(text);
            transcriptContentEl.appendChild(item);
          });
        }

        function renderActionCaptions(course, rawVideoUrl) {
          actionCaptions = getActionCaptions(course, rawVideoUrl);
          actionsContentEl.innerHTML = '';
          if (!actionCaptions.length) {
            actionsContentEl.innerHTML = '<p class="transcript-text">暂无动作流。管理员可在后台视频分享中生成。</p>';
            liveCaptionEl.classList.add('hidden');
            return;
          }
          actionCaptions.forEach(function (caption, index) {
            var item = document.createElement('button');
            item.type = 'button';
            item.className = 'action-item';
            item.setAttribute('data-action-index', String(index));
            item.addEventListener('click', function () {
              videoEl.currentTime = caption.start;
              videoEl.play().catch(function () {});
            });
            var time = document.createElement('p');
            time.className = 'action-time';
            time.textContent = formatTime(caption.start) + ' - ' + formatTime(caption.end)
              + (caption.confidence !== null ? ' · 置信度 ' + Math.round(caption.confidence * 100) + '%' : '');
            var title = document.createElement('p');
            title.className = 'action-title';
            title.textContent = caption.title || caption.text;
            var desc = document.createElement('p');
            desc.className = 'action-desc';
            desc.textContent = caption.description || caption.text;
            item.appendChild(time);
            item.appendChild(title);
            item.appendChild(desc);
            if (caption.handAction || caption.result || caption.objects.length) {
              var meta = document.createElement('p');
              meta.className = 'action-meta';
              var chunks = [];
              if (caption.handAction) chunks.push('手部：' + caption.handAction);
              if (caption.objects.length) chunks.push('对象：' + caption.objects.join('、'));
              if (caption.result) chunks.push('结果：' + caption.result);
              meta.textContent = chunks.join('  ');
              item.appendChild(meta);
            }
            actionsContentEl.appendChild(item);
          });
          updateLiveCaption();
        }

        function updateLiveCaption() {
          if (!actionCaptions.length) return;
          var current = videoEl.currentTime || 0;
          var active = null;
          for (var i = 0; i < actionCaptions.length; i += 1) {
            if (current >= actionCaptions[i].start && current < actionCaptions[i].end) {
              active = actionCaptions[i];
              break;
            }
          }
          if (!active) {
            liveCaptionEl.classList.add('hidden');
            Array.prototype.forEach.call(actionsContentEl.querySelectorAll('.action-item'), function (node) {
              node.classList.remove('active');
            });
            return;
          }
          liveCaptionEl.innerHTML = '';
          var title = document.createElement('strong');
          title.textContent = active.title || active.text;
          var desc = document.createElement('span');
          desc.textContent = active.description || active.text;
          liveCaptionEl.appendChild(title);
          liveCaptionEl.appendChild(desc);
          if (active.handAction || active.result || active.objects.length) {
            var meta = document.createElement('small');
            var chunks = [];
            if (active.handAction) chunks.push('手部：' + active.handAction);
            if (active.objects.length) chunks.push('对象：' + active.objects.join('、'));
            if (active.result) chunks.push('结果：' + active.result);
            meta.textContent = chunks.join('  ');
            liveCaptionEl.appendChild(meta);
          }
          Array.prototype.forEach.call(actionsContentEl.querySelectorAll('.action-item'), function (node, index) {
            node.classList.toggle('active', actionCaptions[index] === active);
          });
          liveCaptionEl.classList.remove('hidden');
        }

        function clearPlaybackTimers() {
          if (playTimeout) {
            window.clearTimeout(playTimeout);
            playTimeout = null;
          }
          if (bufferingTimer) {
            window.clearTimeout(bufferingTimer);
            bufferingTimer = null;
          }
        }

        function hidePlaybackOverlay(message) {
          playButtonEl.classList.add('hidden');
          actionsEl.classList.add('hidden');
          if (message) setMessage(message);
        }

        function updatePlaybackStateFromProgress(event) {
          updateLiveCaption();
          var current = videoEl.currentTime || 0;
          // Seeking changes the clock without proving that playback has resumed.
          if (videoEl.seeking || (event && event.type === 'seeked')) {
            lastPlaybackTime = current;
            return;
          }
          var hasAdvanced = current > lastPlaybackTime + 0.05;
          if (hasAdvanced || current < lastPlaybackTime) lastPlaybackTime = current;
          if (!videoEl.paused && !videoEl.ended && hasAdvanced) {
            clearPlaybackTimers();
            hidePlaybackOverlay('视频正在播放。');
          }
        }

        function getNotesKey() {
          return 'em-box.public-training-notes.' + courseId;
        }

        function loadNotes() {
          try {
            return JSON.parse(localStorage.getItem(getNotesKey()) || '[]');
          } catch (e) {
            return [];
          }
        }

        function saveNotes(notes) {
          try {
            localStorage.setItem(getNotesKey(), JSON.stringify(notes));
          } catch (e) {
            setMessage('笔记保存失败，请检查微信存储权限。');
          }
        }

        function renderNotes() {
          var notes = loadNotes();
          notesListEl.innerHTML = '';
          if (!notes.length) {
            notesListEl.innerHTML = '<p class="transcript-text">暂无笔记。</p>';
            return;
          }
          notes.forEach(function (note) {
            var item = document.createElement('div');
            item.className = 'note';
            var meta = document.createElement('p');
            meta.className = 'note-meta';
            meta.textContent = '视频 ' + formatTime(note.time) + ' · ' + note.createdAt;
            var text = document.createElement('p');
            text.className = 'note-text';
            text.textContent = note.text;
            item.appendChild(meta);
            item.appendChild(text);
            notesListEl.appendChild(item);
          });
        }

        function switchTab(tab) {
          var isActions = tab === 'actions';
          var isTranscript = tab === 'transcript';
          tabActionsEl.classList.toggle('active', isActions);
          tabTranscriptEl.classList.toggle('active', isTranscript);
          tabNotesEl.classList.toggle('active', tab === 'notes');
          actionsPanelEl.classList.toggle('hidden', !isActions);
          transcriptPanelEl.classList.toggle('hidden', !isTranscript);
          notesPanelEl.classList.toggle('hidden', tab !== 'notes');
        }

        function describeVideoError() {
          var error = videoEl.error;
          if (!error) return '视频暂时无法播放，请切换网络后重试。';
          if (error.code === MediaError.MEDIA_ERR_NETWORK) return '视频网络加载失败，请切换网络后重试。';
          if (error.code === MediaError.MEDIA_ERR_DECODE) return '当前微信无法解码这个视频，请使用兜底按钮打开。';
          if (error.code === MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED) return '当前微信不支持这个视频地址或格式。';
          return '视频暂时无法播放，请稍后重试。';
        }

        function armPlaybackTimeout() {
          if (playTimeout) window.clearTimeout(playTimeout);
          var version = sourceVersion;
          lastPlaybackTime = videoEl.currentTime || 0;
          playTimeout = window.setTimeout(function () {
            if (version !== sourceVersion) return;
            playTimeout = null;
            var hasStarted = !videoEl.paused && !videoEl.ended && !videoEl.seeking && videoEl.currentTime > lastPlaybackTime + 0.05;
            if (hasStarted) {
              updatePlaybackStateFromProgress();
              return;
            }
            if (switchToFallbackVideo('当前视频线路加载较慢。')) return;
            actionsEl.classList.remove('hidden');
            playButtonEl.classList.remove('hidden');
            playButtonEl.textContent = '重新播放';
            setMessage('视频加载超时，请重新播放或打开原视频。');
          }, 8000);
        }

        function startPlayback() {
          if (!videoEl.src) return;
          clearPlaybackTimers();
          actionsEl.classList.add('hidden');
          playButtonEl.textContent = '正在缓冲...';
          playButtonEl.classList.remove('hidden');
          setMessage('正在加载视频，如果网络较慢请稍候。');
          armPlaybackTimeout();
          var version = sourceVersion;
          var attempt = ++playAttempt;
          var playResult = videoEl.play();
          if (playResult && typeof playResult.catch === 'function') {
            playResult.catch(function (error) {
              // A source change rejects the previous play promise asynchronously.
              if (version !== sourceVersion || attempt !== playAttempt) return;
              clearPlaybackTimers();
              if (error && (error.name === 'NotAllowedError' || error.name === 'AbortError')) {
                requestedPlayback = false;
                playButtonEl.textContent = '播放视频';
                playButtonEl.classList.remove('hidden');
                setMessage('请点击播放按钮继续。');
                return;
              }
              if (switchToFallbackVideo('当前视频线路无法播放。')) return;
              actionsEl.classList.remove('hidden');
              playButtonEl.classList.remove('hidden');
              playButtonEl.textContent = '重新播放';
              setMessage(describeVideoError());
            });
          }
        }

        function attemptPlay() {
          requestedPlayback = true;
          if (exhaustedCandidates && videoCandidates.length) {
            exhaustedCandidates = false;
            resumeTime = videoEl.currentTime || resumeTime;
            loadCandidate(0);
          }
          startPlayback();
        }

        if (!courseId || !token) {
          titleEl.textContent = '培训链接不可用';
          setMessage('链接缺少必要参数，请重新获取分享链接。');
          return;
        }

        fetch('/training-public-api/course/' + encodeURIComponent(courseId) + '?token=' + encodeURIComponent(token), {
          cache: 'no-store',
          headers: { 'Accept': 'application/json' }
        })
          .then(function (res) {
            return res.json().then(function (data) {
              if (!res.ok) throw new Error((data.error && data.error.message) || '培训链接不可用');
              return data.course || data;
            });
          })
          .then(function (course) {
            if (targetUrl && !isVideoUrl(targetUrl)) {
              renderDocumentMode(course);
              return;
            }
            var rawVideoUrl = findVideoUrl(course);
            var videoUrl = selectVideoUrl(rawVideoUrl);
            titleEl.textContent = course.title || '培训视频';
            descEl.textContent = course.description || '';
            if (!videoUrl) {
              renderDocumentMode(course);
              return;
            }
            loadCandidate(0);
            openVideoEl.href = rawVideoUrl;
            playerEl.classList.remove('hidden');
            tabsEl.classList.remove('hidden');
            renderActionCaptions(course, rawVideoUrl);
            renderTranscript(course);
            renderNotes();
            switchTab(actionCaptions.length ? 'actions' : 'transcript');
            setMessage('视频已就绪。');
          })
          .catch(function (error) {
            titleEl.textContent = '培训链接不可用';
            setMessage(error && error.message ? error.message : '网络出错，请稍后重试。');
          });

        playButtonEl.addEventListener('click', attemptPlay);

        videoEl.addEventListener('play', function () {
          requestedPlayback = true;
          if (!playTimeout) armPlaybackTimeout();
        });

        videoEl.addEventListener('playing', function () {
          hidePlaybackOverlay('视频正在播放。');
        });

        videoEl.addEventListener('pause', function () {
          if (videoEl.paused && !videoEl.ended) {
            clearPlaybackTimers();
            requestedPlayback = false;
            playButtonEl.textContent = '继续播放';
            playButtonEl.classList.remove('hidden');
            setMessage('视频已暂停。');
          }
        });

        videoEl.addEventListener('waiting', function () {
          if (videoEl.paused || videoEl.ended) return;
          if (bufferingTimer || playTimeout) return;
          lastPlaybackTime = videoEl.currentTime || 0;
          bufferingTimer = window.setTimeout(function () {
            bufferingTimer = null;
            if (videoEl.paused || videoEl.ended) return;
            if (!videoEl.seeking && videoEl.currentTime > lastPlaybackTime + 0.05) {
              updatePlaybackStateFromProgress();
              return;
            }
            playButtonEl.textContent = '正在缓冲...';
            playButtonEl.classList.remove('hidden');
            setMessage('视频正在缓冲，请稍候。');
            if (requestedPlayback && !videoEl.paused && !playTimeout) armPlaybackTimeout();
          }, 700);
        });

        videoEl.addEventListener('canplay', function () {
          if (videoEl.paused) {
            playButtonEl.textContent = '播放视频';
            setMessage('视频已加载，请点击播放按钮开始学习。');
          } else {
            hidePlaybackOverlay('视频正在播放。');
          }
        });

        videoEl.addEventListener('canplaythrough', function () {
          if (!videoEl.paused) hidePlaybackOverlay('视频正在播放。');
        });

        videoEl.addEventListener('progress', updatePlaybackStateFromProgress);
        videoEl.addEventListener('timeupdate', updatePlaybackStateFromProgress);
        videoEl.addEventListener('seeking', updatePlaybackStateFromProgress);
        videoEl.addEventListener('seeked', updatePlaybackStateFromProgress);

        videoEl.addEventListener('loadedmetadata', function () {
          if (resumeTime > 0 && isFinite(videoEl.duration)) {
            videoEl.currentTime = Math.min(resumeTime, Math.max(0, videoEl.duration - 0.1));
            lastPlaybackTime = videoEl.currentTime;
            resumeTime = 0;
          }
        });

        videoEl.addEventListener('ended', function () {
          clearPlaybackTimers();
          requestedPlayback = false;
          resumeTime = 0;
          lastPlaybackTime = 0;
          playButtonEl.textContent = '重新播放';
          playButtonEl.classList.remove('hidden');
          setMessage('视频播放完毕。');
        });

        videoEl.addEventListener('error', function () {
          clearPlaybackTimers();
          if (switchToFallbackVideo('视频加载失败。')) return;
          actionsEl.classList.remove('hidden');
          playButtonEl.classList.remove('hidden');
          playButtonEl.textContent = '重新播放';
          setMessage(describeVideoError());
        });

        tabActionsEl.addEventListener('click', function () {
          switchTab('actions');
        });

        tabTranscriptEl.addEventListener('click', function () {
          switchTab('transcript');
        });

        tabNotesEl.addEventListener('click', function () {
          switchTab('notes');
        });

        saveNoteEl.addEventListener('click', function () {
          var text = noteInputEl.value.trim();
          if (!text) {
            setMessage('请输入笔记内容。');
            return;
          }
          var notes = loadNotes();
          notes.unshift({
            text: text,
            time: videoEl.currentTime || 0,
            createdAt: new Date().toLocaleString()
          });
          saveNotes(notes);
          noteInputEl.value = '';
          renderNotes();
          switchTab('notes');
          setMessage('笔记已保存在当前手机浏览器。');
        });
      })();
    </script>
  </body>
</html>
